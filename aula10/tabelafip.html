<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/tabelafip.css">
    <title>Tabela</title>
</head>

<body>
    <table border="1">
        <caption>Relação de disciplinas</caption>
            <thead>
                <tr class="cabeca">
                    <th scope="col"> disciplinas</th>
                    <th scope="col">carga horária</th>
                    <th scope="col">periodos</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Matematica</td>
                    <td>40 horas</td>
                    <td>1 periodo</td>
                </tr>
                <tr>
                    <td>Portugues</td>
                    <td>20 horas</td>
                    <td>2 periodo</td>
                </tr>
            </tbody>
            <tfoot class="pe">
                <tr>
                    <td scope="row" colspan="2">Disciplinas do semestre</td>
                    <td scope="row" colspan="2">3</td>
                </tr>
            </tfoot>
    </table>
</body>

</html>
