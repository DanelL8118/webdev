<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="pt-BR">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script4.js" defer></script>
    <title>Matricula</title>
</head>

<body>
    <h1>Formulário de Matrícula</h1>
    <br>
    <form id="formulario" novalidate>
        <div>
            <label for="nome">Digite seu nome: </label>
            <input type="text" id="nome">
            <span id="erroNome"></span>
        </div>
        <div>
            <label for="matricula">Digite sua matrícula: </label>
            <input type="number" id="matricula">
            <span id="erroMat"></span>
        </div>
        <div>
            <label for="curso">Digite seu curso: </label>
            <input type="text" id="curso">
            <span id="erroCurso"></span>
        </div>
        <br>
        <p id="resposta">.</p>
        <div>
            <button type="submit">Cadastrar</button>
        </div>
    </form>
</body>

</html>
