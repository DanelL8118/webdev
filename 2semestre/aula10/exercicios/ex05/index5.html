<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo produto</title>
</head>

<body>
    <h1>Cadastro de produto</h1>
    <br>
    <form id="formulario">
        <div>
            <label for="nome">Digite o nome do produto:</label>
            <input type="text" id="nome" required minlength="3">
            <span></span>
        </div>
        <div>
            <label for="preco">Digite o preço do produto:</label>
            <input type="number" id="preco" required min="1" step="any">
        </div>
        <div>
            <label for="quant">Digite a quantidade do produto:</label>
            <input type="number" id="quant" required min="1" max="100">
        </div>
        <div>
            <button type="submit">Cadastrar</button>
        </div>
    </form>
</body>

</html>
